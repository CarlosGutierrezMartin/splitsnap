name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llegan varios push seguidos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: "Splitn Android"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Splitn Android/package-lock.json"

      - run: npm ci

      - name: Typecheck y tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        # En GitHub Pages el sitio cuelga de /<repo>/, no de la raíz. Sin este
        # base path todas las rutas de assets y del service worker romperían.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # Activa GitHub Pages con "GitHub Actions" como origen si aún no lo
          # está. Sin esto haría falta entrar a mano en Settings → Pages antes
          # del primer despliegue, y el workflow fallaría hasta entonces.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Splitn Android/dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
